name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-15-intel, macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # Skip building `atlas-brown/try-mac` when it's still a private
      # repository. TODO(gzgz): drop the filter once CI has a token that can
      # read atlas-brown/try-mac (fine-grained PAT or GitHub App), or just wait
      # for the `try-mac` repo to become public.
      - name: Detect formulae
        id: formulae-detect
        if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae-detect

      - name: Exclude try from formulae under test
        id: exclude-try
        if: github.event_name == 'pull_request'
        shell: bash -euo pipefail {0}
        env:
          TESTING: ${{ steps.formulae-detect.outputs.testing_formulae }}
        run: |
          testing=""
          if [[ -n "$TESTING" ]]; then
            testing="$(printf '%s\n' "$TESTING" | tr ',' '\n' | awk -F/ '$NF != "try"' | paste -sd, -)"
          fi
          echo "testing_formulae=$testing" >> "$GITHUB_OUTPUT"

      - name: Run brew test-bot --only-formulae
        if: github.event_name == 'pull_request' && steps.exclude-try.outputs.testing_formulae != ''
        shell: bash -euo pipefail {0}
        env:
          TESTING: ${{ steps.exclude-try.outputs.testing_formulae }}
          ADDED: ${{ steps.formulae-detect.outputs.added_formulae }}
          DELETED: ${{ steps.formulae-detect.outputs.deleted_formulae }}
        run: |
          args=(--only-formulae)
          [[ -n "$TESTING" ]] && args+=(--testing-formulae="$TESTING")
          [[ -n "$ADDED" ]] && args+=(--added-formulae="$ADDED")
          [[ -n "$DELETED" ]] && args+=(--deleted-formulae="$DELETED")
          brew test-bot "${args[@]}"

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
